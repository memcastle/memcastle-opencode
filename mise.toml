# Root task configuration and optional release tooling.

[tools]
git-cliff = "2.12.0"

[tasks."source:opencode:format:check"]
description = "Check formatting for source opencode"
dir = "sources/opencode"
run = "cargo fmt --all -- --check"

[tasks."source:opencode:lint"]
description = "Lint source opencode"
dir = "sources/opencode"
run = "cargo clippy --locked --target wasm32-wasip3 -- -D warnings"

[tasks."source:opencode:test"]
description = "Run native tests for source opencode"
dir = "sources/opencode"
run = "cargo test --locked --lib"

[tasks."source:opencode:build"]
description = "Build the package-ready component for source opencode"
dir = "sources/opencode"
run = '''
set -eu
cargo build --locked --release --target wasm32-wasip3
metadata="$(cargo metadata --locked --no-deps --format-version 1)"
crate="$(printf '%s' "$metadata" | jq -er '.packages[] | select(.manifest_path == (env.PWD + "/Cargo.toml")) | .targets[] | select(.kind | index("cdylib")) | .name')"
target="$(printf '%s' "$metadata" | jq -er '.target_directory')"
cp "$target/wasm32-wasip3/release/$crate.wasm" source.wasm
'''

[tasks."integration:opencode:format:check"]
description = "Run format:check for integration opencode"
dir = "integrations/opencode"
run = "bun run format:check"

[tasks."integration:opencode:lint"]
description = "Run lint for integration opencode"
dir = "integrations/opencode"
run = "bun run lint"

[tasks."integration:opencode:test"]
description = "Run test for integration opencode"
dir = "integrations/opencode"
run = "bun test --timeout 60000"

[tasks."integration:opencode:build"]
description = "Run build for integration opencode"
dir = "integrations/opencode"
run = "bun run build"
