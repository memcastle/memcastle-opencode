format = 1
memcastle = ">=0.5, <0.6"
# Add shared support files or directories here; integration manifests supply their own assets.
artifacts = []

[plugin]
id = "opencode"
provider = "opencode"
description = "OpenCode coding-agent history and lifecycle integration"
repository = "https://github.com/memcastle/memcastle-opencode"
license = "MIT"



[[modules]]
id = "opencode"
type = "source"
manifest = "sources/opencode/memcastle-source.toml"
entry = "sources/opencode/source.wasm"
contract = "0.4.0"


[[modules]]
id = "opencode"
type = "integration"
manifest = "integrations/opencode/memcastle-integration.toml"
entry = "integrations/opencode/dist/index.js"


