name: Publish opencode

on:
  push:
    tags:
      - 'opencode/v*'

permissions:
  contents: write

jobs:
  release:
    uses: memcastle/memcastle/.github/workflows/standalone-plugin-release.yaml@2d36e3521a2fe010ec27a9af72affc0447e3ab53
    with:
      bun-version: '1.4.2'
      core-versions: '[]'
      fixture-bin: modules/opencode/fixtures/bin
      extra-smoke-command: python3 scripts/smoke_install.py --legacy
